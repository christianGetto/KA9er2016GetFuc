function sourceId(id){return ({'turn over':'turn over','waterproof':'waterproof'})[id]||id}
function createPaper(){
 const ex=rand(DATA.sentences.filter(x=>x.level==='easy')).slice(0,4).concat(rand(DATA.sentences.filter(x=>x.level==='medium')).slice(0,4));
 const keys=new Set(ex.map(x=>sourceId(x.id)));
 const distractors=rand(DATA.sentences.filter(x=>!keys.has(sourceId(x.id)))).slice(0,5);
 // Every displayed word (including distractors) blocks the same vocabulary item from Task 1.
 const reserved=new Set([...ex,...distractors].map(x=>sourceId(x.id)));
 const picked={}; for(const l of ['easy','medium','hard']){
  const allowed=DATA.words.filter(w=>w.level===l&&!reserved.has(sourceId(w.id))&&!w.translationExcludedReason);
  const n=l==='hard'?2:4;
  if(allowed.length<n+1) throw new Error('Not enough unique vocabulary for '+l);
  picked[l]=rand(allowed).slice(0,n);
  picked[l].forEach(w=>reserved.add(sourceId(w.id)));
 }
 const given=rand(Object.values(picked).flat());
 const es=rand(ex);
 const uniqueQuiz=QUIZ_QUESTIONS.filter((x,i,a)=>a.findIndex(y=>y.q===x.q)===i);
 const quiz=rand([...rand(uniqueQuiz.filter(x=>x.l==='easy')).slice(0,4),...rand(uniqueQuiz.filter(x=>x.l==='medium')).slice(0,5),...rand(uniqueQuiz.filter(x=>x.l==='hard')).slice(0,3)]).map(x=>({...x,a:rand(x.a.map((txt,i)=>({txt,correct:i===x.c}))).map(z=>z.txt),correctText:x.a[x.c]}));
 return {quiz,grammar:pickGrammar(),sentences:es,wordBank:rand([...ex,...distractors].map(x=>({id:x.id,word:x.word}))),vocab:given,reserved:[...reserved],distractors:distractors.map(x=>x.id)};
}
function newState(){return {version:1,id:'australia_'+Date.now()+'_'+Math.random().toString(36).slice(2,9),created:new Date().toISOString(),name:'',surname:'',year:'',cl:'',lrs:false,started:false,submitted:false,step:0,answers:{},placed:{},quizAnswers:{},grammarAnswers:{},quizJokerUsed:false,quizSeen:[],swap:{easy:0,medium:0,hard:0},event:{hidden:0,split:0,reload:0},paper:createPaper(),demo:true}}

function pickGrammar(){
 const used=new Set();
 function pick(pool,predicate){const candidates=rand(pool.filter(x=>predicate(x)&&!used.has(x.q)));if(!candidates.length)throw Error('Grammar pool incomplete');const x=candidates[0];used.add(x.q);return x;}
 const P=GRAMMAR_POOLS;
 const positive=[
   pick(P.positive,x=>/^(?:studies|flies|carries|watches|washes|teaches|goes|has)$/.test(x.a)),
   pick(P.positive,x=>/^(?:The students|The tourists|My friends|Kangaroos|Koalas|We |I |You )/.test(x.q)&&!(/^(?:studies|flies|carries|watches|washes|teaches|goes|has)$/.test(x.a))),
   pick(P.positive,x=>/^(?:Mia|Tom|Lucy|Jack|The ranger|My brother|Our teacher)/.test(x.q)&&!(/^(?:studies|flies|carries|watches|washes|teaches|goes|has)$/.test(x.a)))
 ];
 const negative=[
   pick(P.negative,x=>x.a.startsWith('does not')&&!x.q.includes('in Europe')),
   pick(P.negative,x=>x.a.startsWith('do not')&&!x.q.includes('in Europe')),
   pick(P.negative,x=>/^(?:is not|are not|am not)$/.test(x.a))
 ];
 const question=[
   pick(P.questions,x=>x.a==='Does'),pick(P.questions,x=>x.a==='Do'),
   pick(P.questions,x=>['Is','Are','Am'].includes(x.a))
 ];
 const be=pick(P.bePositive,()=>true);
 const a=[...positive.map(x=>({...x,kind:'positive',prompt:'('+x.verb+')'})),
 ...negative.map(x=>({...x,kind:'negative',prompt:x.verb==='be'?'(not / be)':'(not / '+x.verb+')'})),
 ...question.map(x=>({...x,kind:'question',prompt:x.a==='Do'||x.a==='Does'?'(do)':'(be)'})),
 {...be,kind:'positiveBe',prompt:'(be)'}];
 return rand(a);
}
function normGrammarAnswer(v){return norm(v).replace(/\bdoesn't\b/g,'does not').replace(/\bdon't\b/g,'do not').replace(/\bisn't\b/g,'is not').replace(/\baren't\b/g,'are not').replace(/\bwasn't\b/g,'was not');}
function acceptedGrammarAnswer(q,a){return normGrammarAnswer(a)===normGrammarAnswer(q.a)}
function grammarAnswer(i,v){if(S.submitted)return;S.grammarAnswers[i]=v;save();updateNav()}
function quizJoker(i){if(S.submitted||S.quizJokerUsed)return;let previous=S.paper.quiz[i];const used=new Set([...(S.quizSeen||[]),...S.paper.quiz.map(q=>q.q)]);const options=rand(QUIZ_QUESTIONS.filter(q=>q.l===previous.l&&!used.has(q.q)));if(!options.length){alert('No replacement question available.');return}if(!confirm('Replace this question? You have only ONE quiz joker.'))return;const x=options[0];const choices=rand(x.a.map((txt,j)=>({txt,correct:j===x.c})));S.quizSeen=[...(S.quizSeen||[]),previous.q];S.paper.quiz[i]={...x,a:choices.map(y=>y.txt),correctText:x.a[x.c]};delete S.quizAnswers[i];S.quizJokerUsed=true;save();render()}

function allowedSwap(level){return !S.submitted&&S.swap[level]<1}
function swapWord(id){if(S.submitted)return;let old=S.paper.vocab.find(x=>x.id===id);if(!old||!allowedSwap(old.level))return;const occupied=new Set([...S.paper.vocab.map(x=>sourceId(x.id)),...S.paper.wordBank.map(x=>sourceId(x.id)),...S.paper.reserved]);let replacements=DATA.words.filter(w=>w.level===old.level&&!occupied.has(sourceId(w.id))&&!w.translationExcludedReason);
 // also blacklist previously swapped words across the current test
 replacements=replacements.filter(w=>!(S.swappedOut||[]).includes(w.id));
 if(!replacements.length){alert('No unused word is available in this difficulty group.');return}
 const replacement=rand(replacements)[0];if(!confirm('Change this word? You have only ONE change per difficulty level.'))return;
 S.swappedOut=[...(S.swappedOut||[]),old.id];S.paper.vocab=S.paper.vocab.map(w=>w.id===id?replacement:w);
 S.paper.reserved.push(sourceId(replacement.id));S.swap[old.level]=1;delete S.answers[id];save();render()}

function progress(n){if(n===0){const vals=S.paper.vocab.map(x=>getValue(S.paper.vocab.indexOf(x)).trim());let count=vals.filter(Boolean).length;return count===0?0:count===10?2:1}if(n===2){const count=Object.keys(S.quizAnswers||{}).length;return count===0?0:count===12?2:1}if(n===3){const count=(S.grammarAnswers||[]).filter(x=>String(x||'').trim()).length;return count===0?0:count===10?2:1}const count=S.paper.sentences.filter(x=>!!S.placed[x.id]).length;return count===0?0:count===8?2:1}
function updateNav(){document.querySelectorAll('[data-tasknav]').forEach(el=>{const n=Number(el.dataset.tasknav);el.className='navbtn '+navClass(n)+(S.step===n?' active':'')})}
function setStep(n){S.step=n;save();chosenWord=null;render()}
function render(){if(S.submitted){results();return}if(!S.started){home();return}let top=`<section class="hero"><div class="eyebrow">Australia · Class ${esc(S.year)}${esc(S.cl).toLowerCase()} · ${esc(S.name)} ${esc(S.surname)}</div><h1>CLASS TEST<span style="color:#ffce72">.</span></h1><p>Australia · Tasks 1–4 · 40 digital points</p></section><div class="nav no-print"><button data-tasknav="0" class="navbtn ${navClass(0)} ${S.step===0?'active':''}" onclick="setStep(0)">01 · Translate</button><button data-tasknav="1" class="navbtn ${navClass(1)} ${S.step===1?'active':''}" onclick="setStep(1)">02 · Sentences</button><button data-tasknav="2" class="navbtn ${navClass(2)} ${S.step===2?'active':''}" onclick="setStep(2)">03 · Australia Quiz</button><button data-tasknav="3" class="navbtn ${navClass(3)} ${S.step===3?'active':''}" onclick="setStep(3)">04 · Simple Present</button><button class="navbtn grey ${S.step===4?'active':''}" onclick="setStep(3)">✓ Review</button></div>`;
 app.innerHTML=top+(S.step===0?task1():S.step===1?task2():S.step===2?task3():S.step===3?task4():review());
}
function task1(){let left={easy:S.swap.easy?0:1,medium:S.swap.medium?0:1,hard:S.swap.hard?0:1};return `<section class="paper"><div class="headrow"><h2>Task 1 · Translate into English</h2><span class="pill">10 points</span></div><p>Write the English word. All 10 words count. You may change <b>one word per difficulty group</b>. The new word will have the same difficulty.</p><p class="quiet">Word changes left: Easy ${left.easy} · Medium ${left.medium} · Hard ${left.hard}. (Difficulty is not shown next to each word.)</p>${S.paper.vocab.map((x,i)=>`<div class="vrow"><strong>${i+1}.</strong><span class="de">${esc(x.de)}</span><input aria-label="English translation for ${esc(x.de)}" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(getValue(i))}" oninput="answerWord('${esc(x.id)}',this)"><button class="swap" ${allowedSwap(x.level)?'':'disabled'} onclick="swapWord('${esc(x.id)}')">↻ Change</button></div>`).join('')}<p class="quiet">10 words · 1 point each · up to 3 changes total (one per difficulty group).</p></section><div class="bottom"><button class="btn secondary" disabled>← Back</button><button class="btn" onclick="setStep(1)">Next →</button></div>`}
function bankWord(id){return S.paper.wordBank.find(x=>x.id===id)}
function bankRemaining(){let used=new Set(Object.values(S.placed));return S.paper.wordBank.filter(x=>!used.has(x.id))}
function sentenceRender(x,i){let chosen=S.placed[x.id],val=chosen?bankWord(chosen)?.word:'';let txt=esc(x.template).replace(/\[\[(.*?)\]\]/g,`<button type="button" class="drop ${chosen?'filled':''}" data-drop="${esc(x.id)}" onclick="fillSentence('${esc(x.id)}')" ondragover="event.preventDefault()" ondrop="dropSentence(event,'${esc(x.id)}')">${esc(val||'Tap to choose…')}</button>`);return `<div class="sentence"><b>${i+1}.</b> ${txt}${chosen?` <button class="btn red small" onclick="clearSentence('${esc(x.id)}')">×</button>`:''}</div>`}
function task2(){let remaining=bankRemaining();return `<section class="paper"><div class="headrow"><h2>Task 2 · Complete the sentences</h2><span class="pill">8 points</span></div><p>Choose the correct word for each gap. <b>Five words are extra.</b> Tap a word and then tap a gap, or drag a word into a gap.</p><div class="bank">${remaining.map(x=>`<button class="word ${chosenWord===x.id?'selected':''}" draggable="true" ondragstart="dragWord(event,'${esc(x.id)}')" onclick="chooseWord('${esc(x.id)}')">${esc(x.word)}</button>`).join('')}</div><p class="quiet">${chosenWord?'Selected: '+esc(bankWord(chosenWord)?.word||'')+' · Now tap a gap.':'Tip: Tap a word first, then tap the matching gap.'}</p>${S.paper.sentences.map(sentenceRender).join('')}</section><div class="bottom"><button class="btn secondary" onclick="setStep(0)">← Back</button><button class="btn" onclick="setStep(2)">Next →</button></div>`}
function chooseWord(id){chosenWord=chosenWord===id?null:id;render()}
function fillSentence(id){if(S.placed[id]){delete S.placed[id];chosenWord=null;save();render();return}if(!chosenWord)return;S.placed[id]=chosenWord;chosenWord=null;save();render()}
function clearSentence(id){delete S.placed[id];save();render()}
function dragWord(ev,id){ev.dataTransfer.setData('text/plain',id)}
function dropSentence(ev,id){ev.preventDefault();const word=ev.dataTransfer.getData('text/plain');if(!bankWord(word))return;const prev=Object.keys(S.placed).find(s=>S.placed[s]===word);if(prev)delete S.placed[prev];S.placed[id]=word;chosenWord=null;save();render()}
function quizAnswer(i,choice){if(S.submitted)return;S.quizAnswers[i]=choice;save();updateNav();const b=document.querySelectorAll('[data-quiz="'+i+'"]');b.forEach(el=>el.classList.toggle('picked',Number(el.dataset.choice)===choice));}
function task3(){return `<section class="paper"><div class="headrow"><h2>Task 3 · Australia Quiz</h2><span class="pill">12 points</span></div><p>Choose <b>one answer</b> for each question. Only one answer is correct. You can change your choices before submitting.</p><p class="quiet">12 questions randomly selected from your Australia training quiz: 4 easy · 5 medium · 3 hard. Every correct answer = 1 point. No hints or immediate feedback. <b>One question change (joker) for the whole quiz.</b> ${S.quizJokerUsed?'Joker already used.':'Joker available.'}</p>${S.paper.quiz.map((x,i)=>`<div class="quizcard"><div class="quiznum">QUESTION ${i+1} / 12</div><div class="quizq">${esc(x.q)}</div><div class="quizoptions">${x.a.map((txt,j)=>`<button type="button" class="quizoption ${S.quizAnswers[i]===j?'picked':''}" data-quiz="${i}" data-choice="${j}" onclick="quizAnswer(${i},${j})"><b>${'ABCD'[j]}.</b> ${esc(txt)}</button>`).join('')}</div><button class="swap" ${S.quizJokerUsed?'disabled':''} onclick="quizJoker(${i})">↻ Change question</button></div>`).join('')}</section><div class="bottom"><button class="btn secondary" onclick="setStep(1)">← Back</button><button class="btn" onclick="setStep(3)">Next →</button></div>`}
function review(){const p=[0,1,2,3].map(progress);const missing=p.some(x=>x!==2);return `<section class="paper"><h2>Review your test</h2><p>Check your answers before submitting your work.</p>${[['Task 1 · Translate',0],['Task 2 · Sentences',1],['Task 3 · Australia Quiz',2],['Task 4 · Simple Present',3]].map(([name,i])=>`<div class="checker"><div><b>${name}</b><br>${p[i]===0?'Not started':p[i]===1?'Not finished':'Completed'}</div><button class="btn secondary" onclick="setStep(${i})">Open</button></div>`).join('')}${missing?'<div class="note"><b>Some tasks are not finished.</b> You can still submit your test.</div>':''}<div class="alert"><b>WICHTIG: TEILKLASSENARBEIT!</b><br>Nach der Abgabe werden nur die Punkte des digitalen Teils angezeigt. Der Dialog wird später mit 15 Punkten bewertet. Eine Endnote gibt es noch nicht.</div><div class="bottom"><button class="btn secondary" onclick="setStep(3)">← Back</button><button class="btn bright" onclick="submit()">SUBMIT TEST →</button></div></section>`}
function grading(){let vrows=S.paper.vocab.map(x=>({word:x.en,de:x.de,answer:(S.answers[x.id]||'').trim(),ok:norm(S.answers[x.id])===norm(x.en)}));let srows=S.paper.sentences.map(x=>({word:x.word,original:x.template,answer:bankWord(S.placed[x.id])?.word||'',ok:S.placed[x.id]===x.id}));let qrows=S.paper.quiz.map((x,i)=>({question:x.q,answer:Number.isInteger(S.quizAnswers?.[i])?x.a[S.quizAnswers[i]]:'',correct:x.correctText,ok:x.a[S.quizAnswers?.[i]]===x.correctText}));let grows=S.paper.grammar.map((x,i)=>({sentence:x.q,prompt:x.prompt,answer:(S.grammarAnswers[i]||'').trim(),correct:x.a,ok:acceptedGrammarAnswer(x,S.grammarAnswers[i])}));return {vrows,srows,qrows,grows,g:grows.filter(x=>x.ok).length,v:vrows.filter(x=>x.ok).length,s:srows.filter(x=>x.ok).length,q:qrows.filter(x=>x.ok).length}}
function submit(){if(!confirm('Submit your test? You cannot change your answers afterwards.'))return;S.submitted=true;S.score=grading();S.submittedAt=new Date().toISOString();save();results()}
function correctedMarkup(){let r=S.score||grading();return `<section class="hero"><div class="eyebrow">Australia · ${esc(S.name)} ${esc(S.surname)} · ${esc(S.year)}${esc(S.cl).toLowerCase()}</div><h1>TEST SUBMITTED.</h1><p>Digital section · Tasks 1–4</p></section><section class="paper"><div class="success"><b>✅ TESTABSCHLUSS LOKAL GESPEICHERT</b><br><span class="small">Nur diese Testkopie! KEINE Übertragung an Google Sheets oder Drive.</span></div><h2>Your digital score: ${r.v+r.s+r.q+r.g} / ${maxScore} points</h2><div class="alert"><h2 style="margin:0 0 8px">ACHTUNG: KEINE ENDNOTE!</h2>Dies ist nur der digitale Teil der Klassenarbeit. Der Dialog wird später mit 15 Punkten bewertet. Die Lehrkraft prüft die Bewertung. Es gibt noch keine Gesamtnote.</div><p><b>Task 1:</b> ${r.v} / 10 · <b>Task 2:</b> ${r.s} / 8 · <b>Task 3:</b> ${r.q} / 12 · <b>Task 4:</b> ${r.g} / 10</p><h2>Correction · Task 1</h2>${r.vrows.map((x,i)=>`<div class="resultRow"><b>${i+1}. ${esc(x.de)}</b><br>Your answer: <span class="${x.ok?'correct':'wrong'}">${esc(x.answer||'—')}</span>${x.ok?' ✓':' ✗'} · Correct: <b>${esc(x.word)}</b></div>`).join('')}<h2 style="margin-top:30px">Correction · Task 2</h2>${r.srows.map((x,i)=>`<div class="resultRow"><b>${i+1}. ${esc(x.original.replace(/\[\[|\]\]/g,''))}</b><br>Your answer: <span class="${x.ok?'correct':'wrong'}">${esc(x.answer||'—')}</span>${x.ok?' ✓':' ✗'} · Correct: <b>${esc(x.word)}</b></div>`).join('')}<h2 style="margin-top:30px">Correction · Task 3 · Australia Quiz (${r.q}/12)</h2>${r.qrows.map((x,i)=>`<div class="resultRow"><b>${i+1}. ${esc(x.question)}</b><br>Your answer: <span class="${x.ok?'correct':'wrong'}">${esc(x.answer||'—')}</span>${x.ok?' ✓':' ✗'} · Correct: <b>${esc(x.correct)}</b></div>`).join('')}<h2 style="margin-top:30px">Correction · Task 4 · Simple Present (${r.g}/10)</h2>${r.grows.map((x,i)=>`<div class="resultRow"><b>${i+1}. ${esc(x.sentence)} ${esc(x.prompt)}</b><br>Your answer: <span class="${x.ok?'correct':'wrong'}">${esc(x.answer||'—')}</span>${x.ok?' ✓':' ✗'} · Correct: <b>${esc(x.correct)}</b></div>`).join('')}</section>`}
function results(){app.innerHTML=correctedMarkup()+`<section class="paper no-print"><h2>Save your corrected test</h2><div class="note">This is a test copy covering tasks 1–4 (40 points). You can test the JPEG download and save a PDF with the browser's print dialog. Google Sheets and Google Drive are NOT connected.</div><button class="btn" onclick="downloadJpeg()">⬇ Save corrected JPEG</button><button class="btn secondary" onclick="window.print()">⬇ Print / Save as PDF</button><button class="btn warn" onclick="resetAll()">🔐 Teacher: new test copy</button></section>`}
function downloadJpeg(){try{
 // Canvas report, no network/CDN and no external libraries. Pixel-perfect report of correction, paginated only in PDF print.
 const r=S.score||grading(),cw=1380,margin=72;let items=[];
 items.push({t:'AUSTRALIA · ENGLISH CLASS TEST',size:45,weight:'900',gap:34});
 items.push({t:S.name+' '+S.surname+' · '+S.year+S.cl.toLowerCase(),size:26,gap:28});
 items.push({t:'DIGITAL PART: '+(r.v+r.s+r.q+r.g)+' / 40 POINTS',size:37,weight:'800',gap:23});
 items.push({t:'VORLÄUFIG! DIALOG (15 PUNKTE) NOCH NICHT BEWERTET',size:24,weight:'800',gap:55});
 items.push({t:'TASK 1 · TRANSLATE INTO ENGLISH  '+r.v+'/10',size:29,weight:'800',gap:26});
 r.vrows.forEach((x,i)=>{items.push({t:(i+1)+'. '+x.de+'   |   '+(x.answer||'—')+(x.ok?'  ✓':'  ✗'),size:23,gap:8});items.push({t:'Correct: '+x.word,size:19,color:x.ok?'#1c7c50':'#b33434',gap:23})});
 items.push({t:'TASK 2 · COMPLETE THE SENTENCES  '+r.s+'/8',size:29,weight:'800',gap:26});
 r.srows.forEach((x,i)=>{items.push({t:(i+1)+'. '+x.word+'  |  Your choice: '+(x.answer||'—')+(x.ok?'  ✓':'  ✗'),size:22,gap:8});items.push({t:x.original.replace(/\[\[|\]\]/g,''),size:18,color:'#415963',gap:26})});
 items.push({t:'TASK 3 · AUSTRALIA QUIZ  '+r.q+'/12',size:29,weight:'800',gap:26});
 r.qrows.forEach((x,i)=>{items.push({t:(i+1)+'. '+x.question,size:22,weight:'700',gap:8});items.push({t:'Your answer: '+(x.answer||'—')+(x.ok?'  ✓':'  ✗'),size:20,gap:5,color:x.ok?'#1c7c50':'#b33434'});items.push({t:'Correct: '+x.correct,size:19,gap:25})});
 items.push({t:'TASK 4 · SIMPLE PRESENT  '+r.g+'/10',size:29,weight:'800',gap:26});
 r.grows.forEach((x,i)=>{items.push({t:(i+1)+'. '+x.sentence+' '+x.prompt,size:22,weight:'700',gap:7});items.push({t:'Your answer: '+(x.answer||'—')+(x.ok?'  ✓':'  ✗'),size:20,color:x.ok?'#1c7c50':'#b33434',gap:5});items.push({t:'Correct: '+x.correct,size:19,gap:23})});
 const test=document.createElement('canvas').getContext('2d'),wrap=(line,font,maxw)=>{test.font=font;let out=[''];for(let word of line.split(' ')){let idx=out.length-1,trial=out[idx]?out[idx]+' '+word:word;if(test.measureText(trial).width>maxw&&out[idx])out.push(word);else out[idx]=trial}return out};
 let y=65,draw=[];for(let it of items){let font=`${it.weight||'500'} ${it.size}px system-ui,Arial`;let lines=wrap(it.t,font,cw-2*margin);draw.push({...it,font,lines,y});y+=lines.length*(it.size*1.35)+it.gap}
 const c=document.createElement('canvas');c.width=cw;c.height=Math.ceil(y+80);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#153c3b';ctx.fillRect(0,0,c.width,18);draw.forEach(it=>{ctx.font=it.font;ctx.fillStyle=it.color||'#1b3540';it.lines.forEach((t,i)=>ctx.fillText(t,margin,it.y+i*it.size*1.35))});
 c.toBlob(b=>{if(!b){alert('JPEG creation failed.');return}const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='Australia_ClassTest_Part1234_'+S.year+S.cl.toLowerCase()+'_'+S.id+'.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/jpeg',.9)
 }catch(e){alert('JPEG creation failed: '+e.message)}}
window.addEventListener('pagehide',()=>{if(S&&!S.submitted)save()});document.addEventListener('visibilitychange',()=>{if(S?.started&&!S.submitted){if(document.hidden)S.event.hidden++;save()}});
S=load()||newState();if(S.started&&!S.submitted)S.event.reload++;save();home();
</script></body></html>
